{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>✏️ Edit Book</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="book-card">

            <form method="POST">
                {% csrf_token %}

                <label>Book Title:</label><br>
                <input type="text"
                       name="title"
                       value="{{ book.title }}"
                       required>
                <br><br>

                <label>Author:</label><br>
                <input type="text"
                       name="author"
                       value="{{ book.author }}"
                       required>
                <br><br>

                <label>Category:</label><br>
                <input type="text"
                       name="category"
                       value="{{ book.category }}"
                       required>
                <br><br>

                <label>ISBN:</label><br>
                <input type="text"
                       name="isbn"
                       value="{{ book.isbn }}"
                       required>
                <br><br>

                <label>Available Copies:</label><br>
                <input type="number"
                       name="available_copies"
                       value="{{ book.available_copies }}"
                       min="0"
                       required>
                <br><br>

                <button type="submit">Update Book</button>

            </form>

        </div>

        <br>

        <a href="/">
            <button>Back to Home</button>
        </a>

    </div>

</body>
</html>
